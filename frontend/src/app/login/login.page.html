<ion-content class="pp-auth-content" [fullscreen]="true">
  <div class="pp-auth">
    <aside class="pp-auth-visual" aria-hidden="true">
      <div class="pp-auth-orb pp-auth-orb--a"></div>
      <div class="pp-auth-orb pp-auth-orb--b"></div>
      <div class="pp-auth-orb pp-auth-orb--c"></div>
      <div class="pp-auth-visual-inner">
        <div class="pp-auth-brand">
          <img
            class="pp-auth-logo"
            src="assets/brand/parqueadero-logo.svg"
            width="88"
            height="88"
            alt=""
          />
          <div class="pp-auth-brand-copy">
            <p class="pp-auth-visual-kicker">Parking solutions</p>
            <p class="pp-auth-visual-title">Parqueadero</p>
            <p class="pp-auth-visual-copy">Ocupación, cobros y usuarios en un solo flujo.</p>
          </div>
        </div>
      </div>
    </aside>

    <section class="pp-auth-panel" aria-labelledby="login-heading">
      <header class="pp-auth-panel-head">
        <div class="pp-auth-panel-brand">
          <img
            class="pp-auth-logo pp-auth-logo--panel"
            src="assets/brand/parqueadero-logo.svg"
            width="48"
            height="48"
            alt="Parqueadero"
          />
        </div>
        <p class="pp-auth-eyebrow">Bienvenido</p>
        <h1 id="login-heading" class="pp-auth-title">Iniciar sesión</h1>
        <p class="pp-auth-subtitle">Usa el correo y la contraseña de tu cuenta.</p>
      </header>

      <form class="pp-auth-form" (ngSubmit)="submit()" novalidate>
        <div class="pp-auth-fields">
          <div class="pp-field">
            <label class="pp-field-label" for="login-email">Correo</label>
            <input
              pInputText
              id="login-email"
              name="email"
              [(ngModel)]="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              autocapitalize="off"
              spellcheck="false"
              placeholder="nombre@correo.com"
              class="w-full pp-auth-input"
              [attr.aria-invalid]="!!errorMessage"
              [attr.aria-describedby]="errorMessage ? 'login-error' : null"
              [disabled]="loading"
              (ngModelChange)="clearError()"
            />
          </div>

          <div class="pp-field">
            <label class="pp-field-label" for="login-password">Contraseña</label>
            <p-password
              inputId="login-password"
              name="password"
              [(ngModel)]="password"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full pp-auth-password"
              [inputStyle]="{ width: '100%' }"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              [disabled]="loading"
              (ngModelChange)="clearError()"
            />
          </div>
        </div>

        @if (errorMessage) {
          <p id="login-error" class="pp-auth-error" role="alert" aria-live="assertive">
            <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
            <span>{{ errorMessage }}</span>
          </p>
        }

        <div class="pp-auth-actions">
          <p-button
            type="submit"
            label="Entrar"
            icon="pi pi-arrow-right"
            iconPos="right"
            styleClass="w-full pp-auth-submit"
            [loading]="loading"
            [disabled]="loading || !canSubmit"
          />
        </div>
      </form>

      <p class="pp-auth-footer">
        ¿Eres propietario?
        <a routerLink="/register" class="pp-auth-link">Crear cuenta</a>
      </p>
      <p class="pp-auth-footer pp-auth-footer--secondary">
        <a routerLink="/consulta" class="pp-auth-link">Consultar placa sin cuenta</a>
      </p>
    </section>
  </div>
</ion-content>
